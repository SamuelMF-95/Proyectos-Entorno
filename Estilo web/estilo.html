<!DOCTYPE html>
        <meta charset="UTF-8">
    <html>
        <head>
            <title>Mi web</title>
            <link rel="stylesheet" href="style2.css">
        </head>
        <body>
            <header>
                Titulo de mi pagina web que estoy creando
            </header>
            <form action="respuesta.html">
                <fieldset> 
                    <legend> Datos Personales </legend>
                    <br>
                    <label for = "nombre"> Nombre </label>
                    <input type = "text" id = "nombre" name = "nombre" placeholder="Tu Nombre" required minlength="2" maxlength="50">
                    <br>
                    <br>
                    <label for = "apellidos"> Apellidos </label>
                    <input type = "text" id = "apellidos" name = "apellidos" placeholder="Tus Apellidos" required minlength="2" maxlength="50">
                    <br>
                    <br>
                    <label for = "email"> Email </label>
                    <input type = "email" id = "email" name = "email" placeholder = "example@email.com" required minlength="2" maxlength="50">
                    <br>
                    <br>
                    <label for = "password"> Contraseña </label>
                    <input type = "password" id = "password" name = "password" placeholder = "Password" required minlength="8" maxlength="16">
                    <br>
                    <br>
                    <label for="telefono"> Telefono </label>
                    <input type="tel" id="telefono" name = "telefono" placeholder="Telefono" pattern="[0-9+ ]{9-15}"> 
                    <br>
                    <br>
                    <label for="url"> URL </label>
                    <input type="url" id="url" name="url" placeholder="www.mipaginaweb.com">
                    <br>
                    <br>
                    <label for="edad"> Edad </label>
                    <input type="number" id="edad" name="edad" placeholder="Edad" min="18" max="99">
                    <br>
                    <br>
                    <label for="fechaNacimiento"> Fecha Nacimiento </label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" placeholder="Fecha" min="1900/01/01" max="1900/01/01">
                    <br>
                    <br>
                    <label for="hora"> Hora </label> 
                    <input type="time" id="hora" name="hora" placeholder="Hora" min="00:00" max="24:59">
                    <br>
                    <br>
                    <br>
                <fieldset>
                    <legend> Forma de Contacto </legend>
                    <br>
                    <input type="radio" id="contact email" name="contact" value="email">
                    <label for="contact email"> Email personal </label> 
                    <br>
                    <br>
                    <input type="radio" id="contact phone" name="contact" value="telefono">
                    <label for="contact phone"> Telefono personal </label> 
                    <br>
                    <br>
                    <input type="radio" id="postal contact" name="contact" value="postal">
                    <label for="postal contact"> Correo postal </label>
                    <br>
                    <br> 
                </fieldset>    
                </fieldset>
                <br>
            </form>
        </body>    
    </html>
