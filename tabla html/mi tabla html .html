<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mi Horario</title>
    <link rel="stylesheet" href="estilo tabla.css" />
  </head>
  <body>
    <table>
      <caption>
        Mi horario académico
      </caption>

      <thead>
        <tr>
          <th scope="col">Horas</th>
          <th scope="col">Lunes</th>
          <th scope="col">Martes</th>
          <th scope="col">Miércoles</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th scope="row">9:00 - 10:00</th>
          <td>Programación</td>
          <td>Programación</td>
          <td>Bases de datos</td>
        </tr>

        <tr>
          <th scope="row">10:00 - 10:30</th>
          <td colspan="3" class="recreo">RECREO</td>
        </tr>

        <tr>
          <th scope="row">10:30 - 11:30</th>
          <td>Entorno</td>
          <td>Programación</td>
          <td>Programación</td>
        </tr>

        <tr>
          <th scope="row">11:30 - 12:30</th>
          <td>Entorno</td>
          <td>Fútbol</td>
          <td>Ajedrez</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
