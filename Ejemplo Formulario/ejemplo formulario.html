<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="hoja estilo formulario.css">
    <head> <title> FORMULARIO DE CONTACTO </title> </head>
    <br>
    <body>
        <header> Fomulario de contacto </header>
        <form>
            <label for = "nombre"> Nombre </label>
            <input type = "text" id="nombre" name="nombre" placeholder="Nombre" maxlength="40" pattern="[a-zA-Zñ]" required autofocus>  

            <label for="codigo_postal"> Codigo Postal </label> 
            <input type="text" id="codigo_postal" name="codigo_postal" placeholder="Codigo Postal" maxlength="6" pattern="[0-9]" required>

            <label for="edad"> Edad </label>
            <input type="number" id="edad" name="edad" placeholder="Edad" min="0" max="99" pattern="[0-9]" required>

            <button type="submit" id="enviar" name="enviar"> ENVIAR </button>
        </form>    
    </body>
</html>
